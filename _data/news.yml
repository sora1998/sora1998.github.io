# Add a new entry at the top to publish an update; no template changes are needed.
# Keep dates quoted (YYYY-MM-DD), use Markdown in text, and link the source in url.
# Dates below mark paper releases (arXiv, the authors' repository, or OpenReview),
# not inferred acceptance dates. Later acceptance updates are stated explicitly.

- date: "2026-08-27"
  label: Publication
  text: >-
    **Sycophancy Suppression Can Impair Rational Updating** is now on arXiv,
    accepted to **EMNLP 2026 Findings**. We study how to reduce sycophancy while
    preserving a model's ability to learn from useful feedback.
  url: "https://arxiv.org/abs/2608.26511"

- date: "2026-06-23"
  label: Preprint
  text: >-
    Introducing **MEMAUDIT**, our benchmark for measuring what AI agents
    actually remember about their users across interactions.
  url: "https://arxiv.org/abs/2606.24595"

