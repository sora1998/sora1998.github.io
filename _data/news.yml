# Add a new entry at the top to publish an update; no template changes are needed.
# Keep dates quoted (YYYY-MM-DD), use Markdown in text, and optionally link a public source in url.
# Dates mark paper releases unless explicitly identified as website announcement dates.
# Later acceptance updates are stated explicitly; acceptance dates are not inferred.

# Website announcement date. The coauthor announced acceptance in September 2026:
# https://shanglinwu.github.io/
- date: "2026-10-22"
  label: Publication
  text: >-
    Excited to share that **JARVIS-Bench** has been accepted to **NeurIPS 2026**
    (Evaluations & Datasets Track)!

- date: "2026-10-14"
  label: Preprint
  text: >-
    Our latest work, **SkillNEO**, is out! We explore how to evolve reusable
    agent skills from execution feedback while preserving useful partial progress.
  url: "https://arxiv.org/abs/2610.20926"

- date: "2026-09-26"
  label: Preprint
  text: >-
    Our new preprint, **How Far Do Persona Effects Generalize in Language Models?**,
    is out! We study when persona effects carry over to new questions, models,
    and prompts.
  url: "https://arxiv.org/abs/2609.32758"

- date: "2026-09-14"
  label: Preprint
  text: >-
    Happy to share **Mind2Dialogue**, our work on training human-aware language
    models using simulated user mental states.
  url: "https://arxiv.org/abs/2609.15972"

- date: "2026-08-27"
  label: Publication
  text: >-
    Our paper, **Sycophancy Suppression Can Impair Rational Updating**, is on arXiv
    and has been accepted to **EMNLP 2026 Findings**! We study how to reduce
    sycophancy while preserving a model's ability to learn from useful feedback.
  url: "https://arxiv.org/abs/2608.26511"

- date: "2026-06-23"
  label: Preprint
  text: >-
    Excited to share **MemAudit**, our benchmark for auditing what AI agents
    retain about their users across interactions.
  url: "https://arxiv.org/abs/2606.24595"

# The survey PDF was first uploaded in repository commit 7ebf96f5b20939526df02b0309118b66becc8317.
- date: "2026-06-12"
  label: Survey
  text: >-
    Our survey, **The Landscape of Agentic Time Series Systems**, is now available!
    We bring together recent work on system architectures, reliability, and
    open research directions.
  url: "https://github.com/TROUBADOUR000/Awesome-Agentic-Time-Series"

- date: "2026-05-21"
  label: Preprint
  text: >-
    Happy to share **ARC-STAR**, our work on auditable corrections for PDE
    foundation models. We focus computation on regions that need refinement.
  url: "https://arxiv.org/abs/2605.22222"

# COLM acceptance was announced in July 2026: https://exlaw.github.io/#news
- date: "2026-04-01"
  label: Publication
  text: >-
    Our preprint, **Locally Confident, Globally Stuck**, is out! We explore the
    trade-off between quality and exploration in diffusion language models.
    July update: excited to share that it has been accepted to **COLM 2026**.
  url: "https://arxiv.org/abs/2604.00375"

- date: "2026-02-12"
  label: Preprint
  text: >-
    Happy to share **CellMaster**, our AI agent for interpretable cell type
    annotation, with support for collaborative human refinement.
  url: "https://arxiv.org/abs/2602.13346"

