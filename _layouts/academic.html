<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <meta name="theme-color" content="#f7f8f2">
  <meta property="og:image" content="{{ '/my_pho_v2.jpg' | absolute_url }}">
  <meta property="og:description" content="{{ page.description | default: page.summary | default: site.description | escape }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/monogram.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner shell">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Enze Ma, home"><span class="brand-mark" aria-hidden="true">em.</span><span>Enze Ma</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a href="{{ '/' | relative_url }}#research">Research</a>
      <a href="{{ '/' | relative_url }}#news"{% if page.url == '/news/' %} aria-current="page"{% endif %}>News</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publication' %} aria-current="page"{% endif %}>Publications <span aria-hidden="true">↗</span></a>
    </nav>
  </div></header>
  <main id="main" class="shell" tabindex="-1">{{ content }}</main>
  <footer class="site-footer shell">
    <a class="footer-name" href="{{ '/' | relative_url }}">Enze Ma<span>Computer Science · UIC</span></a>
    <p>© {{ site.time | date: '%Y' }} Enze Ma</p>
    <a href="#main" class="back-top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</body>
</html>
